<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="title desc">
<title id="title">SOC authentication triage lab</title><desc id="desc">Synthetic events with three detection rules and an explicit slow-spray blind spot.</desc>
<rect width="1080" height="480" rx="20" fill="#0b1220"/><g font-family="Arial, sans-serif" fill="#e7edf5">
<text x="40" y="49" font-size="14" fill="#93c5fd">SECURITY OPERATIONS / DETECTION + TRIAGE</text>
<text x="40" y="92" font-size="30" font-weight="700">From authentication events to evidence</text>
<text x="40" y="122" font-size="14" fill="#a8b8cf">Offline portfolio lab · Fictional events · No live systems contacted</text>
<text x="40" y="185" font-size="28" font-weight="700">1,231 events → 4 alerts → analyst review</text>
<rect x="40" y="225" width="320" height="130" rx="10" fill="#162236"/>
<text x="60" y="257" font-size="13" fill="#a8b8cf">AUTH-001 / MEDIUM</text>
<text x="60" y="291" font-size="18">Repeated failures</text>
<text x="60" y="331" font-size="25" fill="#93c5fd">2 alert(s)</text>
<rect x="380" y="225" width="320" height="130" rx="10" fill="#162236"/>
<text x="400" y="257" font-size="13" fill="#a8b8cf">AUTH-002 / MEDIUM</text>
<text x="400" y="291" font-size="18">Multiple accounts</text>
<text x="400" y="331" font-size="25" fill="#93c5fd">1 alert(s)</text>
<rect x="720" y="225" width="320" height="130" rx="10" fill="#162236"/>
<text x="740" y="257" font-size="13" fill="#a8b8cf">AUTH-003 / HIGH</text>
<text x="740" y="291" font-size="18">Success after failures</text>
<text x="740" y="331" font-size="25" fill="#93c5fd">1 alert(s)</text>
<text x="40" y="408" font-size="14" fill="#a8b8cf">A signal is not a verdict. Review user context, MFA, device and follow-on activity.</text>
<text x="40" y="437" font-size="13" fill="#a8b8cf">Includes a benign credential-failure scenario and a deliberately missed slow-spray sequence.</text>
</g></svg>
